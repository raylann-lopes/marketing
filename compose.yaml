services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      - TZ=America/Sao_Paulo
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - '8080:8080'
    environment:
      - TZ=America/Sao_Paulo
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:postgresql://postgres:5432/postgres
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - JWT_KEY=${JWT_KEY:?JWT_KEY must be set}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-north-producoes-prod}
      - AWS_S3_REGION=${AWS_S3_REGION:-sa-east-1}
      - AWS_S3_PUBLIC_BASE_URL=${AWS_S3_PUBLIC_BASE_URL:-}
      # Vazio = AWS real. Setado = storage S3-compatible customizado (MinIO)
      - AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT:-}
      - AWS_S3_PATH_STYLE_ACCESS=${AWS_S3_PATH_STYLE_ACCESS:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - META_GRAPH_ACCESS_TOKEN=${META_GRAPH_ACCESS_TOKEN:-}
      - EVOLUTION_API_BASE_URL=${EVOLUTION_API_BASE_URL:-}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-}
      - EVOLUTION_API_INSTANCE=${EVOLUTION_API_INSTANCE:-}
      - EVOLUTION_WEBHOOK_SECRET=${EVOLUTION_WEBHOOK_SECRET:?EVOLUTION_WEBHOOK_SECRET must be set}
      - APIFY_API_TOKEN=${APIFY_API_TOKEN:-}
      - BOOTSTRAP_ADMIN_NAME=${BOOTSTRAP_ADMIN_NAME:-}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      # SENTRY_AUTH_TOKEN não vai pro container: só é usado em build-time
      # pelo plugin Maven (upload de source bundle), nunca em runtime
      - SENTRY_AUTO_INIT=${SENTRY_AUTO_INIT:-false}
      - JAVA_OPTS=${JAVA_OPTS:-}
      - OTEL_TRACES_EXPORTER=${OTEL_TRACES_EXPORTER:-none}
      - OTEL_METRICS_EXPORTER=${OTEL_METRICS_EXPORTER:-none}
      - OTEL_LOGS_EXPORTER=${OTEL_LOGS_EXPORTER:-none}
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  postgres_data:
