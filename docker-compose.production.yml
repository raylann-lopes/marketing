services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      - TZ=America/Sao_Paulo
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      restart_policy:
        condition: any

  backend:
    image: ghcr.io/raylann-lopes/producoes-api:latest
    depends_on:
      - postgres
    networks:
      - default
      - wize-net
    environment:
      - TZ=America/Sao_Paulo
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://postgres:5432/${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_KEY=${JWT_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_S3_REGION=${AWS_S3_REGION}
      - AWS_S3_PUBLIC_BASE_URL=${AWS_S3_PUBLIC_BASE_URL}
      # Vazio = AWS real. Setado = storage S3-compatible customizado (MinIO)
      - AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT:-}
      - AWS_S3_PATH_STYLE_ACCESS=${AWS_S3_PATH_STYLE_ACCESS:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - META_GRAPH_ACCESS_TOKEN=${META_GRAPH_ACCESS_TOKEN}
      - EVOLUTION_API_BASE_URL=${EVOLUTION_API_BASE_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_API_INSTANCE=${EVOLUTION_API_INSTANCE}
      - EVOLUTION_WEBHOOK_SECRET=${EVOLUTION_WEBHOOK_SECRET}
      - EVOLUTION_TASKS_INSTANCE=${EVOLUTION_TASKS_INSTANCE:-}
      - EVOLUTION_TASKS_API_KEY=${EVOLUTION_TASKS_API_KEY:-}
      - EVOLUTION_TASKS_WEBHOOK_SECRET=${EVOLUTION_TASKS_WEBHOOK_SECRET:-}
      - WHATSAPP_TASK_DEFAULT_USER_ID=${WHATSAPP_TASK_DEFAULT_USER_ID:-0}
      - WHATSAPP_TASK_ZONE_ID=${WHATSAPP_TASK_ZONE_ID:-America/Sao_Paulo}
      - WHATSAPP_TASK_ALLOWED_NUMBERS=${WHATSAPP_TASK_ALLOWED_NUMBERS:-}
      - WHATSAPP_TASK_MAX_AUDIO_BYTES=${WHATSAPP_TASK_MAX_AUDIO_BYTES:-20000000}
      - WHATSAPP_TASK_MAX_ATTEMPTS=${WHATSAPP_TASK_MAX_ATTEMPTS:-3}
      - WHATSAPP_TASK_RETRY_DELAY_MS=${WHATSAPP_TASK_RETRY_DELAY_MS:-60000}
      - WHATSAPP_TASK_PROCESSING_TIMEOUT_MS=${WHATSAPP_TASK_PROCESSING_TIMEOUT_MS:-600000}
      - APIFY_API_TOKEN=${APIFY_API_TOKEN}
      - BOOTSTRAP_ADMIN_NAME=${BOOTSTRAP_ADMIN_NAME}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD}
      - SENTRY_DSN=${SENTRY_DSN}
      # SENTRY_AUTH_TOKEN não vai pro container: só é usado em build-time
      # pelo plugin Maven (upload de source bundle), nunca em runtime
      - SENTRY_AUTO_INIT=${SENTRY_AUTO_INIT:-false}
      - JAVA_OPTS=${JAVA_OPTS}
      - OTEL_TRACES_EXPORTER=${OTEL_TRACES_EXPORTER:-none}
      - OTEL_METRICS_EXPORTER=${OTEL_METRICS_EXPORTER:-none}
      - OTEL_LOGS_EXPORTER=${OTEL_LOGS_EXPORTER:-none}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.producoes-api.rule=Host(`api.agencianorth.com`)"
        - "traefik.http.routers.producoes-api.entrypoints=websecure"
        - "traefik.http.routers.producoes-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.producoes-api.loadbalancer.server.port=8080"

  frontend:
    image: ghcr.io/raylann-lopes/producoes-web:latest
    depends_on:
      - backend
    networks:
      - default
      - wize-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.producoes-web.rule=Host(`agencianorth.com`)"
        - "traefik.http.routers.producoes-web.entrypoints=websecure"
        - "traefik.http.routers.producoes-web.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.producoes-web.loadbalancer.server.port=80"

networks:
  wize-net:
    external: true

volumes:
  postgres_data:
