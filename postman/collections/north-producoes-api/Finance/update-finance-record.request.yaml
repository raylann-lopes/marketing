$kind: http-request
name: Update Finance Record
method: PATCH
url: '{{baseUrl}}/api/finance/update/{{id}}'
order: 5000
pathVariables:
  - key: id
    value: '{{id}}'
body:
  type: json
  content: |-
    {
      "clientId": 1,
      "amount": 1500.00,
      "description": "Mensalidade atualizada",
      "status": "PAID"
    }
