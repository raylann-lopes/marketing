$kind: http-request
name: Update WhatsApp Metadata
method: PATCH
url: '{{baseUrl}}/api/internal/approvals/{{id}}/whatsapp'
order: 3000
auth:
  type: noauth
headers:
  - key: X-Internal-Api-Key
    value: '{{internalApiKey}}'
pathVariables:
  - key: id
    value: '{{id}}'
body:
  type: json
  content: |-
    {
      "whatsappStanzaId": "stanza123",
      "whatsappGroupId": "group456"
    }
