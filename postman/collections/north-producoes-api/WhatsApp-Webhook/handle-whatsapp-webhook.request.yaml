$kind: http-request
name: Handle WhatsApp Webhook
method: POST
url: '{{baseUrl}}/api/webhooks/whatsapp/{{webhookSecret}}'
order: 1000
auth:
  type: noauth
pathVariables:
  - key: webhookSecret
    value: '{{evolutionWebhookSecret}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "event": "messages.upsert",
      "data": {
        "key": {
          "remoteJid": "5511999999999@s.whatsapp.net",
          "fromMe": false,
          "id": "STANZA_ID_EXAMPLE"
        },
        "messageType": "pollUpdateMessage",
        "message": {
          "pollUpdateMessage": {
            "pollCreationMessageKey": {
              "id": "POLL_STANZA_ID"
            },
            "vote": {
              "selectedOptions": ["✅ Aprovar"]
            }
          }
        }
      }
    }
