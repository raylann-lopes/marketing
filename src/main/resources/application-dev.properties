aws.s3.bucket=${AWS_S3_BUCKET:north-producoes-dev}
aws.s3.region=${AWS_S3_REGION:sa-east-1}

# Springdoc / Swagger UI — habilitado apenas no profile dev
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Sentry
sentry.environment=${SENTRY_ENVIRONMENT:local}
sentry.debug=${SENTRY_DEBUG:true}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:1.0}