spring.application.name=produções
spring.config.import=optional:file:.env[.properties]
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
jwt.secret=${JWT_KEY}
jwt.expiration=86400000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# secure by default; enable only in selected profiles (e.g. dev)
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# AWS S3
aws.s3.bucket=${AWS_S3_BUCKET:north-producoes-prod}
aws.s3.region=${AWS_S3_REGION:sa-east-1}
aws.s3.public-prefix=${AWS_S3_PUBLIC_PREFIX:public/posts}
aws.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:}
aws.s3.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

# n8n internal API key
n8n.api.key=${N8N_INTERNAL_KEY:}
n8n.webhook.upload-complete-url=${N8N_WEBHOOK_UPLOAD_COMPLETE_URL:}
n8n.webhook.api-key=${N8N_WEBHOOK_API_KEY:}

# OpenAI / Spring AI
spring.ai.openai.api-key=${OPENAI_API_KEY:${openai.api.key:}}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o}

# Meta Graph API
meta.graph.base-url=${META_GRAPH_BASE_URL:https://graph.facebook.com}
meta.graph.api-version=${META_GRAPH_API_VERSION:v19.0}
meta.graph.access-token=${META_GRAPH_ACCESS_TOKEN:${META_GRAPH_ACESS_TOKEN:}}

# Evolution API
evolution.api.base-url=${EVOLUTION_API_BASE_URL:}
evolution.api.key=${EVOLUTION_API_KEY:}
evolution.api.instance=${EVOLUTION_API_INSTANCE:}

apify.api.base-url=https://api.apify.com
apify.api.token=${APIFY_API_TOKEN:}
apify.instagram.actor-id=${APIFY_INSTAGRAM_ACTOR_ID:apify/instagram-api-scraper}
apify.instagram.max-results=${APIFY_INSTAGRAM_MAX_RESULTS:100}
