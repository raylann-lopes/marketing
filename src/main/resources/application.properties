spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.application.name=produções
spring.config.import=optional:file:.env[.properties]
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
jwt.secret=${JWT_KEY}
jwt.expiration=86400000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Desabilita open-in-view para evitar warning no startup
spring.jpa.open-in-view=false

# Impede que o RestClient logue headers HTTP (que incluem Authorization: Bearer <token>)
logging.level.org.springframework.web.client=WARN
logging.level.org.springframework.web=WARN
logging.level.org.apache.http=WARN

# AWS S3 (ou qualquer storage S3-compatible, ex. MinIO, via aws.s3.endpoint)
aws.s3.bucket=${AWS_S3_BUCKET}
aws.s3.region=${AWS_S3_REGION}
aws.s3.public-prefix=${AWS_S3_PUBLIC_PREFIX:public/posts}
aws.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:}
aws.s3.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
# Vazio = AWS real. Setado (ex. https://s3.agencianorth.com) = endpoint
# S3-compatible customizado — usado na migração pra MinIO self-hosted.
aws.s3.endpoint=${AWS_S3_ENDPOINT:}
# MinIO/self-hosted normalmente exige path-style; sem efeito quando
# aws.s3.endpoint está vazio (AWS real usa virtual-hosted-style)
aws.s3.path-style-access-enabled=${AWS_S3_PATH_STYLE_ACCESS:false}

# OpenAI / Spring AI
spring.ai.openai.api-key=${OPENAI_API_KEY:${openai.api.key:}}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o}

# Meta Graph API
meta.graph.base-url=${META_GRAPH_BASE_URL:https://graph.facebook.com}
meta.graph.api-version=${META_GRAPH_API_VERSION:v19.0}
meta.graph.access-token=${META_GRAPH_ACCESS_TOKEN}

# Evolution API
evolution.api.base-url=${EVOLUTION_API_BASE_URL:}
evolution.api.key=${EVOLUTION_API_KEY:}
evolution.api.instance=${EVOLUTION_API_INSTANCE:}
evolution.api.tasks-instance=${EVOLUTION_TASKS_INSTANCE:}
evolution.api.tasks-key=${EVOLUTION_TASKS_API_KEY:}
# Secret embutido na URL do webhook (gere um UUID ou string aleatória longa)
evolution.webhook.secret=${EVOLUTION_WEBHOOK_SECRET:}
evolution.webhook.tasks-secret=${EVOLUTION_TASKS_WEBHOOK_SECRET:}

# Proprietário e fuso usados nas tarefas criadas pelo WhatsApp
task.whatsapp.default-user-id=${WHATSAPP_TASK_DEFAULT_USER_ID:0}
task.whatsapp.zone-id=${WHATSAPP_TASK_ZONE_ID:America/Sao_Paulo}
task.whatsapp.allowed-numbers=${WHATSAPP_TASK_ALLOWED_NUMBERS:}
task.whatsapp.max-audio-bytes=${WHATSAPP_TASK_MAX_AUDIO_BYTES:20000000}
task.whatsapp.max-attempts=${WHATSAPP_TASK_MAX_ATTEMPTS:3}
task.whatsapp.retry-delay-ms=${WHATSAPP_TASK_RETRY_DELAY_MS:60000}
task.whatsapp.processing-timeout-ms=${WHATSAPP_TASK_PROCESSING_TIMEOUT_MS:600000}

apify.api.base-url=https://api.apify.com
apify.api.token=${APIFY_API_TOKEN:}
apify.instagram.actor-id=${APIFY_INSTAGRAM_ACTOR_ID:apify/instagram-api-scraper}
apify.instagram.max-results=${APIFY_INSTAGRAM_MAX_RESULTS:100}
# Custo por coleta = perfis x posts (actor cobra por resultado, ~US$2,30/1000)
apify.instagram.search-profiles=${APIFY_INSTAGRAM_SEARCH_PROFILES:3}
apify.instagram.posts-per-profile=${APIFY_INSTAGRAM_POSTS_PER_PROFILE:8}

# Bootstrap admin user
bootstrap.admin.name=${BOOTSTRAP_ADMIN_NAME:}
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Schedulers
scheduler.post.fixed-delay-ms=${SCHEDULER_POST_FIXED_DELAY_MS:300000}

# Springdoc / Swagger UI — desabilitado por padrão, habilitar apenas no profile dev
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Sentry
sentry.dsn=${SENTRY_DSN:}
# Desligado por padrão — habilitar por ambiente exige decisão explícita,
# já que envia IP/dados do usuário junto dos eventos
sentry.send-default-pii=${SENTRY_SEND_DEFAULT_PII:false}
sentry.logs.enabled=true
sentry.logging.minimum-event-level=${SENTRY_LOG_MIN_EVENT_LEVEL:error}
sentry.logging.minimum-breadcrumb-level=${SENTRY_LOG_MIN_BREADCRUMB_LEVEL:info}
sentry.profile-lifecycle=TRACE
