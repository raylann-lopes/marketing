spring.application.name=producoes
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
jwt.secret=${JWT_KEY}
jwt.expiration=86400000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# AWS S3
aws.s3.bucket=${AWS_S3_BUCKET:north-producoes-prod}
aws.s3.region=${AWS_S3_REGION:sa-east-1}
aws.s3.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

# n8n internal API key
n8n.api.key=${N8N_INTERNAL_KEY:change-me-in-production}

# OpenAI / Spring AI
spring.ai.openai.api-key=${OPENAI_API_KEY:${openai.api.key:}}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o}
