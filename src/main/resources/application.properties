spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.application.name=produções
spring.config.import=optional:file:.env[.properties]
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
jwt.secret=${JWT_KEY}
jwt.expiration=86400000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Desabilita open-in-view para evitar warning no startup
spring.jpa.open-in-view=false

# Impede que o RestClient logue headers HTTP (que incluem Authorization: Bearer <token>)
logging.level.org.springframework.web.client=WARN
logging.level.org.springframework.web=WARN
logging.level.org.apache.http=WARN

# AWS S3
aws.s3.bucket=${AWS_S3_BUCKET}
aws.s3.region=${AWS_S3_REGION}
aws.s3.public-prefix=${AWS_S3_PUBLIC_PREFIX:public/posts}
aws.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:}
aws.s3.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

# OpenAI / Spring AI
spring.ai.openai.api-key=${OPENAI_API_KEY:${openai.api.key:}}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o}

# Meta Graph API
meta.graph.base-url=${META_GRAPH_BASE_URL:https://graph.facebook.com}
meta.graph.api-version=${META_GRAPH_API_VERSION:v19.0}
meta.graph.access-token=${META_GRAPH_ACCESS_TOKEN}

# Evolution API
evolution.api.base-url=${EVOLUTION_API_BASE_URL:}
evolution.api.key=${EVOLUTION_API_KEY:}
evolution.api.instance=${EVOLUTION_API_INSTANCE:}
# Secret embutido na URL do webhook (gere um UUID ou string aleatória longa)
evolution.webhook.secret=${EVOLUTION_WEBHOOK_SECRET:}

apify.api.base-url=https://api.apify.com
apify.api.token=${APIFY_API_TOKEN:}
apify.instagram.actor-id=${APIFY_INSTAGRAM_ACTOR_ID:apify/instagram-api-scraper}
apify.instagram.max-results=${APIFY_INSTAGRAM_MAX_RESULTS:100}

# Bootstrap admin user
bootstrap.admin.name=${BOOTSTRAP_ADMIN_NAME:}
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Schedulers
scheduler.post.fixed-delay-ms=${SCHEDULER_POST_FIXED_DELAY_MS:1200000}

# Springdoc / Swagger UI — desabilitado por padrão, habilitado apenas no profile dev
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
