# Banco H2 em memória (modo PostgreSQL para compatibilidade com as entidades)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Deixa o JPA criar o schema a partir das entidades
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Desativa o Flyway nos testes (migrações usam sintaxe específica do PostgreSQL)
spring.flyway.enabled=false

# JWT (valor dummy para os testes não falharem ao subir o contexto)
jwt.secret=dpejjNWP4TO9+SYvlBGj88/o2BLW4yWSAHlK21rXd6H=
jwt.expiration=86400000

# AWS S3 (valores dummy — nenhuma chamada real é feita nos testes)
aws.s3.bucket=test-bucket
aws.s3.region=sa-east-1
aws.s3.access-key-id=
aws.s3.secret-access-key=

# Evolution API
evolution.api.base-url=http://localhost:8080
evolution.api.key=test-key
evolution.api.instance=test-instance

# Apify
apify.api.base-url=https://api.apify.com
apify.api.token=test-key
apify.instagram.actor-id=apify/instagram-api-scraper
apify.instagram.max-results=100

# Spring AI / OpenAI
spring.ai.openai.api-key=test-key
spring.ai.openai.chat.options.model=gpt-4o

# Bootstrap
bootstrap.admin.name=Admin
bootstrap.admin.email=admin@example.com
